<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#eaf6fc;
    --surface:#ffffff;
    --surface-2:#f2fafd;
    --ink:#33495c;
    --ink-soft:#6f8ea1;
    --ink-faint:#a3bdc9;
    --line:#d7ecf5;
    --accent:#4bb4e3;
    --accent-soft:#e1f5fc;
    --gold:#f2a65c;
    --good:#54c2a3;
    --danger:#ef8c85;
    --grp-fixed:#4a90c6;
    --grp-living:#f2a65c;
    --grp-special:#b79ae6;
    --shadow: 0 1px 2px rgba(75,180,227,0.08), 0 10px 26px rgba(75,180,227,0.12);
    --tab-active-bg: #e6ee85;
    --tab-active-ink: #3f4a1e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f2130;
      --surface:#16293a;
      --surface-2:#1c3345;
      --ink:#e6f3fa;
      --ink-soft:#a3c3d6;
      --ink-faint:#6d8b9d;
      --line:#274558;
      --accent:#6fc6ec;
      --accent-soft:#1d3a4a;
      --gold:#f2b876;
      --good:#6fd6b8;
      --danger:#f0998f;
      --grp-fixed:#6fb0e0;
      --grp-living:#f2b876;
      --grp-special:#c6aef0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f2130;
    --surface:#16293a;
    --surface-2:#1c3345;
    --ink:#e6f3fa;
    --ink-soft:#a3c3d6;
    --ink-faint:#6d8b9d;
    --line:#274558;
    --accent:#6fc6ec;
    --accent-soft:#1d3a4a;
    --gold:#f2b876;
    --good:#6fd6b8;
    --danger:#f0998f;
    --grp-fixed:#6fb0e0;
    --grp-living:#f2b876;
    --grp-special:#c6aef0;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.35);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{ background:var(--bg); color:var(--ink); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  #app{
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px 80px;
    font-family: "Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif;
    color: var(--ink);
  }

  .page-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .page-toggle-group{ display:flex; gap:8px; }
  .brand-home{
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink);
    background: none;
    border: none;
    padding: 4px 6px;
    cursor: pointer;
  }
  .brand-home[aria-pressed="true"]{ color: var(--gold); }
  .brand-home:hover{ color: var(--gold); }
  .page-toggle-row button{
    font-size: 12px; font-weight:700; color: var(--ink);
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; cursor:pointer;
  }
  .page-toggle-row button:hover{ border-color: var(--accent); }
  .page-toggle-row button[aria-pressed="true"]{ background: var(--tab-active-bg); border-color: var(--tab-active-bg); color: var(--tab-active-ink); }

  .recurring-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 6px; }
  .recurring-title{
    font-family: "Noto Serif KR", serif; font-weight:600; font-size: 22px; margin:0; text-wrap: balance;
  }
  #backToLedgerBtn{
    font-size: 12px; font-weight:600; color: var(--ink-soft);
    background:none; border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer;
  }
  #backToLedgerBtn:hover{ border-color: var(--accent); color: var(--accent); }
  .recurring-hint{ font-size: 12.5px; color: var(--ink-soft); margin: 0 0 20px; }

  .recurring-row{
    display:flex; align-items:center; gap:10px;
    padding: 10px 4px; border-bottom: 1px solid var(--line);
  }
  .recurring-row:last-child{ border-bottom:none; }
  .recurring-cat{ font-size: 13px; font-weight:600; min-width: 90px; flex-shrink:0; }
  .recurring-day{ font-size: 11.5px; color: var(--ink-faint); flex-shrink:0; white-space:nowrap; }
  .recurring-memo{ flex:1; font-size:12.5px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recurring-memo.placeholder{ color: var(--ink-faint); }
  .recurring-amount{ font-variant-numeric: tabular-nums; font-weight:600; font-size:13.5px; white-space:nowrap; }

  .settings-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-label{ font-size: 13.5px; font-weight:600; }
  .settings-select{
    width:auto; padding: 7px 10px; border-radius: 8px; border:1px solid var(--line);
    background: var(--surface); color: var(--ink); font-size:13px; font-family:inherit;
  }
  .settings-segment{ display:inline-flex; gap:6px; }
  .settings-segment button{
    padding: 7px 16px; border-radius: 8px; border:1px solid var(--line);
    background: var(--surface); color: var(--ink); font-weight:700; font-size:13px; cursor:pointer;
  }
  .settings-segment button[aria-pressed="true"]{ background: var(--tab-active-bg); border-color: var(--tab-active-bg); color: var(--tab-active-ink); }

  .switch{ position:relative; display:inline-block; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch-slider{
    position:absolute; inset:0; background: var(--line); border-radius:999px; cursor:pointer;
  }
  .switch-slider::before{
    content:''; position:absolute; width:18px; height:18px; left:3px; top:3px;
    background:#fff; border-radius:50%; box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .switch input:checked + .switch-slider{ background: var(--accent); }
  .switch input:checked + .switch-slider::before{ transform: translateX(18px); }
  .switch input:focus-visible + .switch-slider{ outline:2px solid var(--accent); outline-offset:2px; }

  .stats-mode-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .stats-mode-tabs button{
    flex:1; padding: 9px; border-radius: 10px; border:1px solid var(--line);
    background: var(--surface); color: var(--ink); font-weight:700; font-size:13px; cursor:pointer;
  }
  .stats-mode-tabs button[aria-pressed="true"]{ background: var(--tab-active-bg); border-color: var(--tab-active-bg); color: var(--tab-active-ink); }

  .stats-year-nav{
    display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px;
  }
  .stats-year-nav button{
    width:32px; height:32px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .stats-year-nav button:hover{ border-color:var(--accent); color:var(--accent); }
  .stats-year-nav .stats-year-label{
    font-family:"Noto Serif KR",serif; font-weight:600; font-size:18px; min-width:80px; text-align:center;
  }

  .stats-month-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:18px; }
  .stats-month-grid button{
    padding: 16px 6px; border-radius: 10px; border:1px solid var(--line);
    background: var(--surface); color: var(--ink); font-weight:600; font-size:14px; cursor:pointer;
  }
  .stats-month-grid button:hover{ border-color:var(--accent); }
  .stats-month-grid button.selected{ background: var(--tab-active-bg); border-color: var(--tab-active-bg); color: var(--tab-active-ink); }

  .stats-range-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .stats-range-row input{
    flex:1; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:13px; font-family:inherit;
  }
  .stats-range-row span{ color: var(--ink-faint); font-size:12px; }
  .stats-goto-btn{
    display:block; width:100%; padding:11px; border-radius:10px; border:none;
    background: var(--accent-soft); color: var(--accent); font-weight:600; font-size:13.5px;
    cursor:pointer; margin-bottom:22px;
  }
  .stats-goto-btn:hover{ opacity:0.85; }
  .stats-result-label{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin-bottom: 28px;
  }
  .month-nav button{
    width: 36px; height:36px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .month-nav button:hover{ border-color: var(--accent); color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .period-tabs{ display:flex; justify-content:center; margin-bottom: 20px; }
  .period-tabs-track{
    display:inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .period-tabs-track button{
    padding: 6px 22px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .period-tabs-track button[aria-pressed="true"]{
    background: var(--tab-active-bg); color: var(--tab-active-ink);
  }
  .month-nav h1{
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: clamp(22px, 4vw, 30px);
    margin: 0;
    min-width: 160px;
    text-align:center;
    text-wrap: balance;
  }

  .summary{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .tile{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px;
    box-shadow: var(--shadow);
  }
  .tile .label{
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .tile .value{
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(14px, 3.4vw, 19px);
    letter-spacing: -0.01em;
  }
  .tile.balance{
    background: var(--accent-soft);
    border-color: transparent;
  }
  .tile.income .value{ color: var(--good); }
  .tile-sub{ margin-top:5px; display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .tile.balance .value.negative{ color: var(--danger); }

  .budget-bar{
    display:flex; align-items:center; flex-wrap:wrap; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 20px; font-size: 12.5px;
  }
  .budget-bar.empty{ color: var(--ink-soft); justify-content:space-between; }
  .budget-item{ display:flex; flex-direction:column; gap:2px; }
  .budget-label{ font-size: 10.5px; color: var(--ink-faint); }
  .budget-value{ font-weight:700; font-variant-numeric: tabular-nums; }
  .budget-value.negative{ color: var(--danger); }
  .budget-edit-btn, #setBudgetBtn{
    margin-left:auto; font-size:12px; font-weight:600; color: var(--accent);
    background:none; border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer;
  }
  .budget-edit-btn:hover, #setBudgetBtn:hover{ border-color: var(--accent); }
  .budget-bar.editing{ gap:8px; }
  .budget-bar.editing input{
    flex:1; min-width:120px; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:13px; font-family:inherit;
  }

  .avg-compare{
    width:100%; display:flex; flex-direction:column; gap:4px;
    font-size: 12px; color: var(--ink-soft);
  }
  .avg-compare .diff.over{ color: var(--danger); font-weight:600; }
  .avg-compare .diff.under{ color: var(--good); font-weight:600; }

  .no-spend-dot{ width:5px; height:5px; border-radius:50%; background: var(--gold); }
  .no-spend-summary{ text-align:center; font-size:11.5px; color: var(--ink-soft); margin-top:10px; }

  .calendar{ margin-bottom: 24px; }
  .calendar-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-weekday{ text-align:center; font-size: 11px; color: var(--ink-faint); font-weight:600; padding: 2px 0 8px; }
  .calendar-weekday.sun{ color: var(--danger); }
  .calendar-weekday.sat{ color: var(--accent); }
  .calendar-cell{
    min-height: 58px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 6px 7px;
    cursor: pointer;
    display:flex; flex-direction:column; gap:4px;
  }
  .calendar-cell.empty{ border-color: transparent; background: transparent; cursor: default; }
  .calendar-cell:not(.empty):hover{ border-color: var(--accent); }
  .calendar-cell.today{ border-color: var(--gold); border-width: 2px; }
  .calendar-cell.selected{ background: var(--accent-soft); border-color: var(--accent); }
  .calendar-day-num{ font-size: 12px; font-weight: 700; color: var(--ink); }
  .calendar-day-num.sun{ color: var(--danger); }
  .calendar-day-num.sat{ color: var(--accent); }
  .calendar-day-amt{ font-size: 10px; color: var(--ink-soft); font-variant-numeric: tabular-nums; line-height:1.3; }
  .calendar-day-amt.cal-income{ color: var(--good); }
  .calendar-income-dot{ width:5px; height:5px; border-radius:50%; background: var(--good); }
  @media (max-width: 520px){
    .calendar-cell{ min-height: 44px; padding: 4px 5px; }
    .calendar-day-amt{ font-size: 9px; }
  }

  .layout{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    align-items:start;
  }
  @media (max-width: 720px){
    .layout{ grid-template-columns: 1fr; }
  }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  .panel h2{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 14px;
    letter-spacing: 0.02em;
  }

  .donut-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .donut-svg{ width: 168px; height: 168px; }
  .donut-center-value{ font-weight:700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .donut-center-label{ font-size: 11px; }

  .legend{ width:100%; display:flex; flex-direction:column; gap:9px; }
  .legend-row{ display:flex; align-items:center; gap:8px; font-size: 13px; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend-name{ flex:1; color: var(--ink); font-weight:600; }
  .legend-amount{ font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size:12.5px; }
  .empty-note{ font-size: 13px; color: var(--ink-faint); text-align:center; padding: 20px 0; }

  .divider{ height:1px; background:var(--line); margin:16px 0; }

  .breakdown{ width:100%; display:flex; flex-direction:column; gap:14px; }
  .breakdown-group-header{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; }
  .breakdown-group-header .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .breakdown-group-header .amt{ margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-weight:600; }
  .breakdown-sub-row{ display:flex; padding: 3px 0 3px 14px; font-size:12px; color:var(--ink-soft); }
  .breakdown-sub-row .amt{ margin-left:auto; font-variant-numeric:tabular-nums; }

  .add-toggle{
    width:100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px dashed var(--line);
    background: var(--surface-2);
    color: var(--accent);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .add-toggle:hover{ border-color: var(--accent); }

  .add-form{
    display:flex; flex-direction:column; gap:10px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .type-toggle{ display:flex; gap:8px; }
  .type-toggle button{
    flex:1; padding: 9px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .type-toggle button[aria-pressed="true"]{
    background: var(--tab-active-bg); border-color: var(--tab-active-bg); color: var(--tab-active-ink);
  }
  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add-form input, .add-form select{
    width:100%;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  .add-form input::placeholder{ color: var(--ink-faint); }
  .form-actions{ display:flex; gap:8px; align-items:center; }
  .save-btn{
    padding: 10px 18px;
    border-radius: 9px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .save-btn:disabled{ opacity: 0.6; cursor:default; }
  .form-msg{ font-size: 12.5px; color: var(--danger); }

  .example-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .example-banner button{
    border:none; background:none; color: var(--accent);
    font-weight:600; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }

  .tx-list{
    background-image: repeating-linear-gradient(var(--surface), var(--surface) 43px, var(--line) 44px);
    border-radius: 10px;
  }
  .tx-group + .tx-group{ margin-top: 4px; }
  .tx-group-header{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-faint);
    padding: 6px 4px;
    letter-spacing: 0.03em;
  }
  .tx-group-totals{
    display:flex; gap:8px; font-weight:500; font-variant-numeric: tabular-nums; letter-spacing:normal;
  }
  .tx-group-totals .tg-income{ color: var(--good); }
  .tx-group-totals .tg-card, .tx-group-totals .tg-cash{ color: var(--ink-faint); }
  .tx-group-totals .tg-remain{ color: var(--ink-faint); }
  .tx-group-totals .tg-remain.negative{ color: var(--danger); }
  .tx-row{
    display:flex; align-items:center; gap: 10px;
    padding: 10px 4px;
    min-height: 44px;
  }
  .tx-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .tx-cat{ font-size: 12.5px; color: var(--ink-soft); min-width: 76px; flex-shrink:0; }
  .tx-memo{ flex:1; font-size: 13.5px; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-memo.placeholder{ color: var(--ink-faint); }
  .tx-example-tag{
    font-size: 10.5px; color: var(--gold); border: 1px solid var(--gold);
    border-radius: 999px; padding: 1px 6px; flex-shrink:0;
  }
  .tx-method-tag{
    font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 6px; flex-shrink:0;
  }
  .tx-amount{ font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; white-space:nowrap; }
  .tx-amount.expense{ color: var(--ink); }
  .tx-amount.income{ color: var(--good); }
  .tx-delete{
    border:none; background:none; color: var(--ink-faint);
    font-size: 15px; cursor:pointer; padding: 2px 4px; flex-shrink:0;
  }
  .tx-delete:hover{ color: var(--danger); }

  .list-empty{ text-align:center; padding: 40px 10px; color: var(--ink-faint); font-size: 13.5px; }

  .year-table-head, .year-row{ display:flex; align-items:center; gap:10px; padding: 8px 4px; }
  .year-table-head{ font-size:11px; color:var(--ink-faint); font-weight:600; border-bottom:1px solid var(--line); }
  .year-row{ border-bottom:1px solid var(--line); cursor:pointer; }
  .year-row:hover{ background: var(--surface-2); }
  .year-row:last-child{ border-bottom:none; }

  function toISODate(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function fmtWon(n){ return Number(n||0).toLocaleString('ko-KR') + '원'; }
  function fmtCompact(n){
    n = Number(n||0);
    if(n >= 10000){
      var man = n/10000;
      return (man >= 100 ? Math.round(man) : Math.round(man*10)/10) + '만';
    }
    return n.toLocaleString('ko-KR');
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

  function populateSubcatOptions(groupKey, selectEl){
    selectEl.innerHTML = SUBCATS[groupKey].map(function(c){ return '<option value="'+c.key+'">'+c.label+'</option>'; }).join('');
  }

      incomeSelect.innerHTML = INCOME_CATS.map(function(c){ return '<option value="'+c.key+'">'+c.label+'</option>'; }).join('');
      methodRow.hidden = true;
    }

  updateCategoryRow();

  addToggleBtn.addEventListener('click', function(){
    addForm.hidden = !addForm.hidden;
    addToggleBtn.textContent = addForm.hidden ? '+ 거래 추가' : '닫기';

    var digits = amountInput.value.replace(/[^0-9]/g, '');

      formMsg.textContent = '금액을 입력해주세요';

      category: catSelect.value,
      amount: amount,

      payload.group = groupSelect.value;
      payload.method = methodSelect.value;

  function renderRecurringList(){
    if(!recurringLoaded) return;
    if(!recurringItems.length){
      recurringListArea.innerHTML = '<div class="list-empty">등록된 반복 항목이 없어요.</div>';
      return;
    }
    var byGroup = {};
    recurringItems.forEach(function(item){
      var key = item.type === 'income' ? 'income' : (item.group || 'special');
      (byGroup[key] = byGroup[key] || []).push(item);
    });
    var DISPLAY_GROUPS = [{key:'income', label:'수입'}].concat(GROUPS);
    var html = '';
    DISPLAY_GROUPS.forEach(function(g){
      var items = byGroup[g.key];
      if(!items || !items.length) return;
      var dotColor = g.key === 'income' ? 'var(--good)' : ('var(--grp-'+g.key+')');
      html += '<div class="breakdown-group-header"><span class="dot" style="background:'+dotColor+'"></span><span>'+g.label+'</span></div>';
      items.forEach(function(item){
        var dayLabel = item.dayOfMonth ? ('매월 ' + item.dayOfMonth + '일') : '매월 1일';
        var memo = item.memo ? escapeHtml(item.memo) : '';

  function ensureRecurringApplied(){
    if(!db || !loaded || !recurringLoaded || applyingRecurring) return;
    var now = new Date();
    var currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    var creates = [];
    recurringItems.forEach(function(item){
      var start = item.createdAt ? new Date(item.createdAt) : currentMonthStart;
      var cursor = new Date(start.getFullYear(), start.getMonth(), 1);
      var guard = 0;
      while(cursor.getTime() <= currentMonthStart.getTime() && guard < 36){
        guard++;
        var mk = cursor.getFullYear() + '-' + String(cursor.getMonth()+1).padStart(2,'0');
        var exists = allTx.some(function(t){ return t.recurringId === item.id && typeof t.date === 'string' && t.date.slice(0,7) === mk; });
        if(!exists){
          var dim = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
          var day = item.dayOfMonth ? Math.min(item.dayOfMonth, dim) : 1;
          var iso = mk + '-' + String(day).padStart(2,'0');
          var itemType = item.type || 'expense';
          var tx = {
            type: itemType, category: item.category, amount: item.amount,
            memo: item.memo || '', date: iso,
            isExample: false, recurringId: item.id, createdAt: Date.now()
          };
          if(itemType === 'expense'){
            tx.group = item.group;
            tx.method = item.method || 'credit';
          }
          creates.push(tx);
        }
        cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
      }
    });
    if(!creates.length) return;
    applyingRecurring = true;
    var chain = Promise.resolve();
    creates.forEach(function(c){
      chain = chain.then(function(){ return db.collection('transactions').add(c); });
    });
    chain.catch(function(){}).then(function(){ applyingRecurring = false; });
  }

  function computePastAverage(year, monthIdx){
    var monthTotals = {};
    allTx.forEach(function(t){
      if(t.type !== 'expense' || typeof t.date !== 'string') return;
      var mk = bucketKeyForDate(t.date);
      monthTotals[mk] = (monthTotals[mk]||0) + (Number(t.amount)||0);
    });
    var viewedMk = bucketKeyFor(year, monthIdx);
    var pastMks = Object.keys(monthTotals).filter(function(mk){ return mk < viewedMk; }).sort();
    pastMks = pastMks.slice(-6);
    if(!pastMks.length) return null;
    var sum = pastMks.reduce(function(s,mk){ return s + monthTotals[mk]; }, 0);
    return {avg: sum/pastMks.length, count: pastMks.length};
  }

  function renderAvgCompare(expense){

    var pct = cmp.avg > 0 ? Math.round((diff/cmp.avg)*100) : 0;
    var cls = diff >= 0 ? 'over' : 'under';
    var sign = diff >= 0 ? '+' : '';
    return '<div class="divider"></div><div class="avg-compare">' +
      '<span>지난 ' + cmp.count + '개월 평균 지출 ' + fmtWon(Math.round(cmp.avg)) + '</span>' +
      '<span class="diff ' + cls + '">이번 달 ' + sign + fmtWon(diff) + ' (' + sign + pct + '%)</span>' +
      '</div>';
  }

  function bucketKeyFor(year, monthIdx){ return year + '-' + String(monthIdx+1).padStart(2,'0'); }

  function bucketKeyForDate(dateStr){
    if(monthStartDay <= 1) return dateStr.slice(0,7);
    var d = new Date(dateStr + 'T00:00:00');
    if(d.getDate() >= monthStartDay){
      return bucketKeyFor(d.getFullYear(), d.getMonth());
    }
    var prev = new Date(d.getFullYear(), d.getMonth()-1, 1);
    return bucketKeyFor(prev.getFullYear(), prev.getMonth());
  }

  function getBucketRange(year, monthIdx){
    if(monthStartDay <= 1){
      return { start: new Date(year, monthIdx, 1), end: new Date(year, monthIdx+1, 0) };
    }
    return { start: new Date(year, monthIdx, monthStartDay), end: new Date(year, monthIdx+1, monthStartDay-1) };
  }

  function computeGroupRows(txList){

      if(t.type !== 'expense') return;
      var g = groupOf(t);

    });
    return GROUPS.map(function(g){ return {key:g.key, label:g.label, amount: totals[g.key]||0}; })
      .filter(function(r){ return r.amount > 0; })
      .sort(function(a,b){ return b.amount - a.amount; });
  }

  function renderCalendar(year, monthIdx){
    var range = getBucketRange(year, monthIdx);
    var start = range.start, end = range.end;
    var totalDays = Math.round((end - start) / 86400000) + 1;
    var startIso = toISODate(start), endIso = toISODate(end);
    var todayIso = toISODate(new Date());
    var selectedIso = toISODate(viewDate);

    var byDate = {};
    allTx.forEach(function(t){
      if(typeof t.date !== 'string' || t.date < startIso || t.date > endIso) return;
      var amt = Number(t.amount)||0;
      var e = byDate[t.date] || {income:0, expense:0, cash:0, card:0};
      if(t.type === 'income'){ e.income += amt; }
      else { e.expense += amt; if(t.method === 'credit') e.card += amt; else e.cash += amt; }
      byDate[t.date] = e;
    });

    var firstJsDay = start.getDay();
    var firstDisplayIdx = weekStartsMonday ? (firstJsDay+6)%7 : firstJsDay;
    var totalCells = firstDisplayIdx + totalDays;
    var trailing = (7 - (totalCells % 7)) % 7;
    var noSpendCount = 0;
    var headerLabels = weekStartsMonday ? ['월','화','수','목','금','토','일'] : ['일','월','화','수','목','금','토'];

    var html = '<div class="calendar"><div class="calendar-grid">';
    headerLabels.forEach(function(w){
      var cls = w === '일' ? ' sun' : (w === '토' ? ' sat' : '');
      html += '<div class="calendar-weekday' + cls + '">' + w + '</div>';
    });
    for(var i=0; i<firstDisplayIdx; i++){ html += '<div class="calendar-cell empty"></div>'; }

    var cur = new Date(start);
    for(var d=0; d<totalDays; d++){
      var iso = toISODate(cur);
      var jsDay = cur.getDay();
      var data = byDate[iso];
      var isPast = iso <= todayIso;
      var noSpend = isPast && (!data || data.expense === 0);
      if(noSpend) noSpendCount++;
      var cls2 = 'calendar-cell';
      if(iso === todayIso) cls2 += ' today';
      if(iso === selectedIso) cls2 += ' selected';
      var numCls = 'calendar-day-num' + (jsDay===0?' sun':jsDay===6?' sat':'');
      var amtHtml = '';
      if(splitCalendarByMethod){
        if(data && data.cash>0) amtHtml += '<span class="calendar-day-amt">현금 -'+fmtCompact(data.cash)+'</span>';
        if(data && data.card>0) amtHtml += '<span class="calendar-day-amt">카드 -'+fmtCompact(data.card)+'</span>';
        if(data && data.income>0) amtHtml += '<span class="calendar-day-amt cal-income">+'+fmtCompact(data.income)+'</span>';
      } else {
        if(data && data.expense>0) amtHtml = '<span class="calendar-day-amt">-'+fmtCompact(data.expense)+'</span>';
      }
      html += '<div class="'+cls2+'" data-date="'+iso+'">' +
        '<span class="'+numCls+'">'+cur.getDate()+'</span>' +
        amtHtml +
        (noSpend ? '<span class="no-spend-dot" title="무지출 데이"></span>' : '') +
        (!splitCalendarByMethod && data && data.income>0 ? '<span class="calendar-income-dot"></span>' : '') +
        '</div>';
      cur.setDate(cur.getDate()+1);
    }
    for(var j=0; j<trailing; j++){ html += '<div class="calendar-cell empty"></div>'; }
    html += '</div>';
    if(noSpendCount > 0){
      html += '<div class="no-spend-summary">이번 달 무지출 ' + noSpendCount + '일</div>';
    }
    html += '</div>';
    return html;
  }

  function groupOf(t){ return t.group || CAT_TO_GROUP[t.category] || 'special'; }

  function renderDonut(groupRows, total){
    if(!groupRows.length || total <= 0){
      return '<div class="empty-note">이번 달 지출 내역이 없어요</div>';
    }
    var r = 70, cx = 100, cy = 100, sw = 26;
    var circumference = 2 * Math.PI * r;
    var cumulative = 0;
    var segs = groupRows.map(function(g){
      var frac = g.amount / total;
      var len = frac * circumference;
      var seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--grp-'+g.key+')" ' +
        'stroke-width="'+sw+'" stroke-dasharray="'+len+' '+(circumference-len)+'" ' +
        'stroke-dashoffset="'+(-cumulative)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      cumulative += len;
      return seg;
    }).join('');

    var svg = '<svg class="donut-svg" viewBox="0 0 200 200">' +
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'"/>' +
      segs +
      '<text x="100" y="96" text-anchor="middle" class="donut-center-value" fill="var(--ink)">' + fmtWon(total) + '</text>' +
      '<text x="100" y="114" text-anchor="middle" class="donut-center-label" fill="var(--ink-soft)">총 지출</text>' +
      '</svg>';

    var legend = '<div class="legend">' + groupRows.map(function(g){
      var pct = Math.round((g.amount/total)*100);
      return '<div class="legend-row">' +
        '<span class="legend-dot" style="background:var(--grp-'+g.key+')"></span>' +
        '<span class="legend-name">' + escapeHtml(g.label) + '</span>' +
        '<span class="legend-amount">' + fmtWon(g.amount) + ' · ' + pct + '%</span>' +
        '</div>';
    }).join('') + '</div>';

    return '<div class="donut-wrap">' + svg + legend + '</div>';
  }

  function renderBreakdown(groupRows, monthTx){
    if(!groupRows.length) return '';
    var html = '<div class="divider"></div><div class="breakdown">';
    groupRows.forEach(function(g){
      var subTotals = {};
      monthTx.forEach(function(t){
        if(t.type !== 'expense' || groupOf(t) !== g.key) return;
        subTotals[t.category] = (subTotals[t.category]||0) + (Number(t.amount)||0);
      });
      var subRows = Object.keys(subTotals).map(function(k){
        return {label: CAT_LABEL[k] || k, amount: subTotals[k]};
      }).sort(function(a,b){ return b.amount - a.amount; });

      html += '<div class="breakdown-group">';
      html += '<div class="breakdown-group-header"><span class="dot" style="background:var(--grp-'+g.key+')"></span>' +
        '<span>' + escapeHtml(g.label) + '</span><span class="amt">' + fmtWon(g.amount) + '</span></div>';
      subRows.forEach(function(s){
        html += '<div class="breakdown-sub-row"><span>' + escapeHtml(s.label) + '</span><span class="amt">' + fmtWon(s.amount) + '</span></div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderList(monthTx, opts){
    if(!monthTx.length){
      return '<div class="list-empty">이번 달 기록이 없어요. 위에서 거래를 추가해보세요.</div>';
    }
    var byDate = {};
    monthTx.forEach(function(t){ (byDate[t.date] = byDate[t.date] || []).push(t); });
    var dates = Object.keys(byDate).sort().reverse();

    var cumByDate = null;
    if(opts && opts.showBudget){
      cumByDate = {};
      var ascDates = Object.keys(byDate).sort();
      var cum = 0;
      ascDates.forEach(function(dt){
        byDate[dt].forEach(function(t){ if(t.type==='expense') cum += Number(t.amount)||0; });
        cumByDate[dt] = cum;
      });
    }
    var html = '<div class="tx-list">';
    dates.forEach(function(date){
      var items = byDate[date].slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      var d = new Date(date + 'T00:00:00');
      var day = d.getDate();
      var wd = WEEKDAY[d.getDay()];

      var dayIncome = 0, dayCard = 0, dayCash = 0;
      items.forEach(function(t){
        var amt = Number(t.amount)||0;
        if(t.type === 'income'){ dayIncome += amt; }
        else if(t.method === 'credit'){ dayCard += amt; }
        else { dayCash += amt; }
      });
      var totalParts = [];
      if(dayIncome>0) totalParts.push('<span class="tg-income">+'+fmtWon(dayIncome)+'</span>');
      if(dayCard>0) totalParts.push('<span class="tg-card">카드 -'+fmtWon(dayCard)+'</span>');
      if(dayCash>0) totalParts.push('<span class="tg-cash">현금 -'+fmtWon(dayCash)+'</span>');
      if(cumByDate){
        var remain = budgetAmount - cumByDate[date];
        totalParts.push('<span class="tg-remain'+(remain<0?' negative':'')+'">남음 '+fmtWon(remain)+'</span>');
      }

      html += '<div class="tx-group">';
      html += '<div class="tx-group-header"><span>' + day + '일 (' + wd + ')</span>' +
        '<span class="tx-group-totals">' + totalParts.join('') + '</span></div>';
      items.forEach(function(t){
        var isExpense = t.type === 'expense';
        var dotVar = isExpense ? ('var(--grp-'+groupOf(t)+')') : 'var(--good)';
        var catLabel = CAT_LABEL[t.category] || t.category;
        var memo = t.memo ? escapeHtml(t.memo) : '';
        html += '<div class="tx-row">' +
          '<span class="tx-dot" style="background:'+dotVar+'"></span>' +
          '<span class="tx-cat">' + escapeHtml(catLabel) + '</span>' +
          (isExpense && t.method ? '<span class="tx-method-tag">' + (METHOD_SHORT[t.method] || t.method) + '</span>' : '') +
          '<span class="tx-memo' + (memo ? '' : ' placeholder') + '">' + (memo || '메모 없음') + '</span>' +
          (t.isExample ? '<span class="tx-example-tag">예시</span>' : '') +
          '<span class="tx-amount ' + (isExpense?'expense':'income') + '">' + (isExpense?'-':'+') + fmtWon(t.amount) + '</span>' +
          '<button type="button" class="tx-delete" data-id="' + t.id + '" aria-label="삭제">×</button>' +
          '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function render(){
    updateMonthLabel();
    if(!loaded) return;

    var monthTx = getPeriodTx();

    var income = 0, expense = 0, cashExpense = 0, cardExpense = 0;
    monthTx.forEach(function(t){
      if(t.type === 'income'){ income += Number(t.amount)||0; return; }
      var amt = Number(t.amount)||0;
      expense += amt;
      if(t.method === 'credit') cardExpense += amt; else cashExpense += amt;
    });
    var balance = income - expense;

    var groupTotals = {};
    monthTx.forEach(function(t){
      if(t.type !== 'expense') return;
      var g = groupOf(t);
      groupTotals[g] = (groupTotals[g]||0) + (Number(t.amount)||0);
    });
    var groupRows = GROUPS.map(function(g){
      return {key:g.key, label:g.label, amount: groupTotals[g.key]||0};
    }).filter(function(r){ return r.amount > 0; }).sort(function(a,b){ return b.amount - a.amount; });

    var hasExamples = allTx.some(function(t){ return t.isExample; });
    bannerArea.innerHTML = hasExamples
      ? '<div class="example-banner"><span>예시 데이터가 포함되어 있어요. 확인 후 지워도 돼요.</span><button type="button" id="clearExamplesBtn">예시 데이터 지우기</button></div>'
      : '';

    summaryArea.innerHTML =
      '<div class="tile income"><div class="label">수입</div><div class="value">' + fmtWon(income) + '</div></div>' +
      '<div class="tile expense"><div class="label">지출</div><div class="value">' + fmtWon(expense) + '</div>' +
        '<div class="tile-sub"><span>현금 ' + fmtWon(cashExpense) + '</span><span>카드 ' + fmtWon(cardExpense) + '</span></div></div>' +
      '<div class="tile balance"><div class="label">잔액</div><div class="value' + (balance<0 ? ' negative':'') + '">' + fmtWon(balance) + '</div></div>';

    donutArea.innerHTML = renderDonut(groupRows, expense) + renderBreakdown(groupRows, monthTx) + renderAvgCompare(expense);

    calendarArea.innerHTML = activeTab === 'month' ? renderCalendar(viewDate.getFullYear(), viewDate.getMonth()) : '';

    if(activeTab === 'month'){
      var monthExpenseForBudget = 0;
      monthTx.forEach(function(t){ if(t.type==='expense') monthExpenseForBudget += Number(t.amount)||0; });
      budgetArea.innerHTML = renderBudgetBar(monthExpenseForBudget);
    } else {
      budgetArea.innerHTML = '';
    }

    if(activeTab === 'year'){
      listHeading.textContent = '월별 요약';
      listArea.innerHTML = renderYearTable(viewDate.getFullYear());
    } else {
      listHeading.textContent = '거래 내역';
      listArea.innerHTML = renderList(monthTx, {showBudget: activeTab==='month' && budgetAmount!=null});
    }

    renderStatsPage();
  }

  updateMonthLabel();

  (async function init(){
    try{
      db = await claude.use('db');
    }catch(e){
      db = null;
    }
    if(!db){
      donutArea.innerHTML = '<div class="status-line">저장소를 사용할 수 없어요. 새로고침해보세요.</div>';
      listArea.innerHTML = '';
      return;
    }
    db.collection('transactions').onSnapshot(function(snap){
      allTx = snap.docs.map(function(d){
        var data = d.data() || {};
        data.id = d.id;
        return data;
      });
      loaded = true;
      render();
      ensureRecurringApplied();
    }, function(){
      donutArea.innerHTML = '<div class="status-line">데이터를 불러오지 못했어요.</div>';
      listArea.innerHTML = '';
    });

    db.collection('recurring').onSnapshot(function(snap){
      recurringItems = snap.docs.map(function(d){
        var data = d.data() || {};
        data.id = d.id;
        return data;
      });
      recurringLoaded = true;
      renderRecurringList();
      ensureRecurringApplied();
    }, function(){
      recurringListArea.innerHTML = '<div class="status-line">데이터를 불러오지 못했어요.</div>';
    });

    db.doc('settings/budget').onSnapshot(function(snap){
      budgetAmount = snap.exists ? (Number(snap.data().amount) || null) : null;
      budgetLoaded = true;
      render();
    }, function(){
      budgetLoaded = true;
    });

    db.doc('settings/preferences').onSnapshot(function(snap){
      var d = snap.exists ? (snap.data() || {}) : {};
      monthStartDay = d.monthStartDay || 1;
      weekStartsMonday = !!d.weekStartsMonday;
      splitCalendarByMethod = d.splitCalendarByMethod !== undefined ? !!d.splitCalendarByMethod : true;
      settingsLoaded = true;
      syncSettingsUI();
      render();
    }, function(){
      settingsLoaded = true;
    });
  })();
})();
</script>
